[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "unofficialblackduck-onboardingtool"
version = "0.1.0"
description = "Unofficial BlackDuck Github Enterprise Onboarding tool"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[project.scripts]
github-inventory = "github_inventory.cli:main"

github-onboard = "github_onboard.cli:main"
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["github_inventory*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
